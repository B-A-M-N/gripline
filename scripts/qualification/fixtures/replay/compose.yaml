services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    environment:
      POSTGRES_USER: gripline
      POSTGRES_PASSWORD: gripline
      POSTGRES_DB: gripline
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${GRIPLINE_REPLAY_POSTGRES_PORT:-25436}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gripline -d gripline"]
      interval: 2s
      timeout: 2s
      retries: 30
