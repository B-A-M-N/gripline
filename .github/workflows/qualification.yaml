name: reference qualification

on:
  workflow_dispatch:
    inputs:
      soak_duration:
        description: "Reference soak duration (use 24h or 72h for long qualification)"
        required: false
        default: "30s"
        type: string
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reference-smoke:
    name: repository-owned qualification lab
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert SDK runtimes
        run: |
          python3 --version
          node --version
          npm --version
      - name: Repository-owned reference qualification suite
        env:
          GRIPLINE_QUALIFICATION_RESULT_DIR: qualification-results
        run: bash scripts/qualification/suite.sh --soak-duration 30s --workers 8
      - name: Scan qualification evidence for secrets
        if: always()
        run: python3 scripts/qualification/scan-evidence.py qualification-results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gripline-reference-smoke-evidence
          path: qualification-results/
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: qualification-results/manifest.json

  long-soak:
    name: long reference qualification soak
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.soak_duration == '24h' || inputs.soak_duration == '72h'))
    runs-on: [self-hosted, linux, gripline-qualification]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Long active/active qualification
        env:
          GRIPLINE_QUALIFICATION_RESULT_DIR: qualification-long-soak-results
        run: bash scripts/qualification/suite.sh --only-soak --soak-duration "${{ inputs.soak_duration || '24h' }}" --workers 24
      - name: Scan long-soak evidence for secrets
        if: always()
        run: python3 scripts/qualification/scan-evidence.py qualification-long-soak-results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gripline-reference-long-soak-evidence
          path: qualification-long-soak-results/
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: qualification-long-soak-results/manifest.json
