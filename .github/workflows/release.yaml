name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert toolchain
        run: test "$(go env GOVERSION)" = "go1.25.13"
      - name: Set build metadata
        id: buildmeta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Verify release tree
        run: |
          go vet ./...
          go mod tidy -diff
          git diff --check
          staticcheck ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go build ./...
          go test ./...
          go test -race ./...
          go test -run TestGate -v ./internal/gates/
          go test -v ./internal/observability/
          go test -run TestAdmissionLatencyBudget -v ./internal/terminator/
          go test -run "TestAcceptance" -v ./cmd/gripline/
          test -z "$(gofmt -l internal cmd verify adapter)"
          go run ./cmd/gripline-demo --headless
          bash scripts/release-harness.sh
      - name: Build and smoke-test release container
        run: |
          docker build \
            --build-arg VERSION="${{ steps.buildmeta.outputs.version }}" \
            --build-arg COMMIT="${{ steps.buildmeta.outputs.commit }}" \
            --build-arg BUILD_DATE="${{ steps.buildmeta.outputs.date }}" \
            -t gripline-release:${GITHUB_SHA} -f deploy/Dockerfile .
          docker run --rm gripline-release:${GITHUB_SHA} --version | grep -F "gripline ${GITHUB_REF_NAME}"
          bash deploy/container-smoke.sh gripline-release:${GITHUB_SHA}
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${{ steps.buildmeta.outputs.version }} -X main.buildCommit=${{ steps.buildmeta.outputs.commit }} -X main.buildDate=${{ steps.buildmeta.outputs.date }}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o dist/gripline-linux-amd64 ./cmd/gripline
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o dist/gripline-linux-arm64 ./cmd/gripline
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/gripline-demo-linux-amd64 ./cmd/gripline-demo
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/gripline-demo-linux-arm64 ./cmd/gripline-demo
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gripline-${{ github.ref_name }}-binaries
          path: dist/
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          sbom: true
          provenance: true
      - name: Attest release binaries
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/*
      - name: Attest pushed image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Smoke-test pushed tagged image
        run: |
          docker pull "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"
          bash deploy/container-smoke.sh "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
