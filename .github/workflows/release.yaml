name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release-preflight:
    name: release tag and ancestry preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release tag fixtures
        run: |
          bash scripts/validate-release-tag.sh "$GITHUB_REF_NAME"
          bash scripts/validate-release-tag-test.sh
      - name: Require the exact tagged tree and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch origin main:refs/remotes/origin/main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  release-fast-check:
    name: exact-SHA fast release check
    needs: release-preflight
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: gripline
          POSTGRES_PASSWORD: gripline
          POSTGRES_DB: gripline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gripline -d gripline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require the exact tagged tree
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run fast exact-SHA prerequisite
        env:
          GRIPLINE_TEST_POSTGRES_DSN: postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable
        run: |
          go test ./...
          go test -count=1 -run '^TestPostgres' ./internal/statepg
          go vet ./...
          go build ./...
          git diff --check

  qualification:
    name: release long-soak qualification evidence
    needs: [release-preflight, release-fast-check]
    runs-on: [self-hosted, linux, gripline-qualification]
    # The suite contains a full 24h soak plus setup, evidence scanning, and
    # manifest verification. Keep the job below GitHub's five-day self-hosted
    # limit while leaving operational headroom beyond the requested soak.
    timeout-minutes: 1560
    outputs:
      qualification_commit: ${{ steps.manifest.outputs.commit }}
      manifest_sha256: ${{ steps.manifest.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run exact-SHA reference qualification suite
        env:
          GRIPLINE_QUALIFICATION_RESULT_DIR: qualification-release-results
        run: bash scripts/qualification/suite.sh --soak-duration 24h --workers 24
      - name: Scan qualification evidence for secrets
        if: always()
        run: python3 scripts/qualification/scan-evidence.py qualification-release-results
      - name: Test evidence scanner controls
        if: always()
        run: bash scripts/qualification/scan-evidence-test.sh
      - name: Verify qualification manifest
        id: manifest
        run: |
          bash scripts/qualification/verify-manifest.sh qualification-release-results "$GITHUB_SHA"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum qualification-release-results/manifest.json | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gripline-release-qualification-evidence
          path: qualification-release-results/

  release:
    needs: qualification
    environment: release
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: gripline
          POSTGRES_PASSWORD: gripline
          POSTGRES_DB: gripline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gripline -d gripline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gripline-release-qualification-evidence
          path: qualification-release-results
      - name: Re-scan downloaded qualification evidence
        run: python3 scripts/qualification/scan-evidence.py qualification-release-results
      - name: Verify exact qualification evidence for this release
        run: |
          bash scripts/qualification/verify-manifest.sh qualification-release-results "$GITHUB_SHA"
          test "$(sha256sum qualification-release-results/manifest.json | awk '{print $1}')" = "${{ needs.qualification.outputs.manifest_sha256 }}"
      - name: Attest exact qualification manifest
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: qualification-release-results/manifest.json
      - name: Assert toolchain
        run: test "$(go env GOVERSION)" = "go1.25.13"
      - name: Set build metadata
        id: buildmeta
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Verify release tree
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          go run github.com/securego/gosec/v2/cmd/gosec@v2.22.8 -quiet ./...
          GRIPLINE_FUZZ_TIME=2s bash scripts/fuzz-smoke.sh
          go vet ./...
          go mod tidy -diff
          git diff --check
          staticcheck ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
          go build ./...
          go test ./...
          GRIPLINE_TEST_POSTGRES_DSN=postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable go test -count=1 -v ./internal/statepg -run '^TestPostgres'
          GRIPLINE_TEST_POSTGRES_DSN=postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable go test -count=1 -race -v ./internal/statepg -run '^TestPostgres'
          GRIPLINE_TEST_POSTGRES_DSN=postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable GRIPLINE_CLUSTER_HARNESS_REQUIRE_DB_OUTAGE=1 bash scripts/cluster-harness.sh
          go test -race ./...
          go test -run TestGate -v ./internal/gates/
          go test -v ./internal/observability/
          go test -run TestAdmissionLatencyBudget -v ./internal/terminator/
          go test -run "TestAcceptance" -v ./cmd/gripline/
          test -z "$(gofmt -l internal cmd verify adapter)"
          go run ./cmd/gripline-demo --headless
          bash scripts/release-harness.sh
          bash scripts/chaos-smoke.sh
      - name: Build and smoke-test release container
        run: |
          docker build \
            --build-arg VERSION="${{ steps.buildmeta.outputs.version }}" \
            --build-arg COMMIT="${{ steps.buildmeta.outputs.commit }}" \
            --build-arg BUILD_DATE="${{ steps.buildmeta.outputs.date }}" \
            -t gripline-release:${GITHUB_SHA} -f deploy/Dockerfile .
          docker run --rm gripline-release:${GITHUB_SHA} --version | grep -F "gripline ${GITHUB_REF_NAME}"
          bash deploy/container-smoke.sh gripline-release:${GITHUB_SHA}
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          ldflags="-s -w -X main.version=${{ steps.buildmeta.outputs.version }} -X main.buildCommit=${{ steps.buildmeta.outputs.commit }} -X main.buildDate=${{ steps.buildmeta.outputs.date }}"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o dist/gripline-linux-amd64 ./cmd/gripline
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="${ldflags}" -o dist/gripline-linux-arm64 ./cmd/gripline
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/gripline-demo-linux-amd64 ./cmd/gripline-demo
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/gripline-demo-linux-arm64 ./cmd/gripline-demo
          sha256sum dist/* > dist/SHA256SUMS
      - name: Install cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.1
      - name: Sign release checksum manifest
        env:
          COSIGN_YES: "true"
        run: "$(go env GOPATH)/bin/cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gripline-${{ github.ref_name }}-binaries
          path: dist/
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.buildmeta.outputs.version }}
            COMMIT=${{ steps.buildmeta.outputs.commit }}
            BUILD_DATE=${{ steps.buildmeta.outputs.date }}
          sbom: true
          provenance: true
      - name: Attest release binaries
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/*
      - name: Attest pushed image
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Sign pushed image manifest
        env:
          COSIGN_YES: "true"
        run: "$(go env GOPATH)/bin/cosign sign --yes '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}'"
      - name: Smoke-test pushed tagged image
        run: |
          docker pull "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"
          bash deploy/container-smoke.sh "${{ steps.image.outputs.name }}:${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
