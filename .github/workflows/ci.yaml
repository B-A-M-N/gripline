name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testify:
    name: vet + staticcheck + race + gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: gripline
          POSTGRES_PASSWORD: gripline
          POSTGRES_DB: gripline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gripline -d gripline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # P1-31: the Go version comes from go.mod so the toolchain can never
          # drift below what the code requires.
          go-version-file: go.mod
          cache: true

      - name: Assert toolchain
        run: test "$(go env GOVERSION)" = "go1.25.13"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: diff check
        run: git diff --check

      - name: Assert immutable container bases
        run: |
          awk '/^[[:space:]]*FROM[[:space:]]+/ { split($2, image, "@sha256:"); if (length(image) != 2 || length(image[2]) != 64 || image[2] !~ /^[0-9a-f]+$/) { print "unpinned base: " $0; bad=1 } } END { exit bad }' deploy/Dockerfile scripts/qualification/fixtures/http2/Dockerfile

      - name: staticcheck
        run: staticcheck ./...

      - name: go build
        run: go build ./...

      - name: PostgreSQL authority integration
        env:
          GRIPLINE_TEST_POSTGRES_DSN: postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable
        run: go test -v ./internal/statepg -run '^TestPostgres'

      - name: PostgreSQL authority integration under race
        env:
          GRIPLINE_TEST_POSTGRES_DSN: postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable
        run: go test -race -v ./internal/statepg -run '^TestPostgres'

      - name: three-node PostgreSQL cluster harness
        env:
          GRIPLINE_TEST_POSTGRES_DSN: postgres://gripline:gripline@localhost:5432/gripline?sslmode=disable
          GRIPLINE_CLUSTER_HARNESS_REQUIRE_DB_OUTAGE: "1"
        run: bash scripts/cluster-harness.sh

      - name: definitive causal demo
        run: go run ./cmd/gripline-demo --headless

      - name: compiled release harness
        run: bash scripts/release-harness.sh

      - name: failure-semantics chaos smoke
        run: bash scripts/chaos-smoke.sh

      - name: container build
        run: docker build -t gripline-ci -f deploy/Dockerfile .

      - name: container runtime smoke
        run: bash deploy/container-smoke.sh gripline-ci

      - name: go test -race (full)
        run: go test -race ./...

      - name: Acceptance gates (spec §111)
        run: go test -run TestGate -v ./internal/gates/

      - name: Decision-record credential-safety (Gate A / INV-2)
        run: go test -v ./internal/observability/

      - name: Evidence scanner controls
        run: bash scripts/qualification/scan-evidence-test.sh

      - name: Latency keyword gate (§112)
        run: go test -run TestAdmissionLatencyBudget -v ./internal/terminator/

      - name: Executable acceptance suite
        run: go test -run "TestAcceptance" -v ./cmd/gripline/

      - name: gofmt check (touched files must be formatted)
        run: test -z "$(gofmt -l internal cmd verify adapter)"
