name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testify:
    name: vet + staticcheck + race + gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # P1-31: the Go version comes from go.mod so the toolchain can never
          # drift below what the code requires.
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: go vet
        run: go vet ./...

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: diff check
        run: git diff --check

      - name: staticcheck
        run: staticcheck ./...

      - name: go build
        run: go build ./...

      - name: definitive causal demo
        run: go run ./cmd/gripline-demo --headless

      - name: container build
        run: docker build -t gripline-ci -f deploy/Dockerfile .

      - name: container runtime smoke
        run: bash deploy/container-smoke.sh gripline-ci

      - name: go test -race (full)
        run: go test -race ./...

      - name: Acceptance gates (spec §111)
        run: go test -run TestGate -v ./internal/gates/

      - name: Decision-record credential-safety (Gate A / INV-2)
        run: go test -v ./internal/observability/

      - name: Latency keyword gate (§112)
        run: go test -run TestAdmissionLatencyBudget -v ./internal/terminator/

      - name: Executable acceptance suite
        run: go test -run "TestAcceptance" -v ./cmd/gripline/

      - name: gofmt check (touched files must be formatted)
        run: test -z "$(gofmt -l internal cmd verify)"
